<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d">
  <title id="t">Architecture at a glance</title>
  <desc id="d">Your application and the k9o CLI call the Kilimanjaro API Gateway, which fronts the Governed Database, Keep, Pulse, Gate and Kibo, runs your agents and functions in the Firelock sandbox, and records every call in the audit trail. Your own KMS or HSM stays on your side and Kibo encrypts against it on your machine.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb0ff"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="780" rx="16" fill="#0b1b35"/>
  <rect x="10" y="10" width="1180" height="760" rx="10" fill="none" stroke="#1f3a6b" stroke-width="1.5"/>
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <rect x="30" y="60" width="380" height="670" rx="8" fill="none" stroke="#7da2ff" stroke-width="2" stroke-dasharray="10 7"/>
    <text x="48" y="96" font-size="24" fill="#9db6e8" text-anchor="start">Your machine / your cloud</text>
    <rect x="60" y="120" width="320" height="140" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="220.0" y="163" font-size="28" font-weight="700" fill="#eaf1ff" text-anchor="middle">Your application</text>
    <text x="220.0" y="199" font-size="24" fill="#b8cbf2" text-anchor="middle">SDK or k9o CLI</text>
    <text x="220.0" y="235" font-size="24" fill="#b8cbf2" text-anchor="middle">8 languages + mobile</text>
    <rect x="60" y="450" width="320" height="140" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="220.0" y="493" font-size="28" font-weight="700" fill="#eaf1ff" text-anchor="middle">Your KMS / HSM</text>
    <text x="220.0" y="529" font-size="24" fill="#b8cbf2" text-anchor="middle">keys stay with you</text>
    <text x="220.0" y="565" font-size="24" fill="#b8cbf2" text-anchor="middle">in BYOK / HYOK mode</text>
    <path d="M110 262 V448" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <text x="134" y="344" font-size="24" fill="#b8cbf2" text-anchor="start">Kibo encrypts and</text>
    <text x="134" y="376" font-size="24" fill="#b8cbf2" text-anchor="start">decrypts in your app</text>
    <path d="M382 190 H438" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="440" y="62" width="240" height="492" rx="6" fill="#1a66ff" stroke="#9ec0ff" stroke-width="2"/>
    <text x="560" y="245" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700">API</text>
    <text x="560" y="281" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="700">Gateway</text>
    <text x="560" y="317" font-size="24" fill="#dbe7ff" text-anchor="middle">in your region</text>
    <text x="560" y="353" font-size="24" fill="#dbe7ff" text-anchor="middle">or your</text>
    <text x="560" y="389" font-size="24" fill="#dbe7ff" text-anchor="middle">environment</text>
    <path d="M682 108 H718" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="720" y="62" width="410" height="92" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="745" y="100" font-size="28" fill="#eaf1ff" text-anchor="start" font-weight="700">Keep</text>
    <text x="745" y="134" font-size="24" fill="#b8cbf2" text-anchor="start">AI security and governance</text>
    <path d="M682 208 H718" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="720" y="162" width="410" height="92" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="745" y="200" font-size="28" fill="#eaf1ff" text-anchor="start" font-weight="700">Pulse</text>
    <text x="745" y="234" font-size="24" fill="#b8cbf2" text-anchor="start">Streams, analytics, live feeds</text>
    <path d="M682 308 H718" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="720" y="262" width="410" height="92" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="745" y="300" font-size="28" fill="#eaf1ff" text-anchor="start" font-weight="700">Gate</text>
    <text x="745" y="334" font-size="24" fill="#b8cbf2" text-anchor="start">Sign-in, sessions, scoping</text>
    <path d="M682 408 H718" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="720" y="362" width="410" height="92" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="745" y="400" font-size="28" fill="#eaf1ff" text-anchor="start" font-weight="700">Kibo</text>
    <text x="745" y="434" font-size="24" fill="#b8cbf2" text-anchor="start">Secrets vault, key operations</text>
    <path d="M682 508 H718" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="720" y="462" width="410" height="92" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="745" y="500" font-size="28" fill="#eaf1ff" text-anchor="start" font-weight="700">Governed Database</text>
    <text x="745" y="534" font-size="24" fill="#b8cbf2" text-anchor="start">SQL, NoSQL, full-text, vectors</text>
    <path d="M562 556 V595" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-start="url(#ah)" marker-end="url(#ah)"/>
    <rect x="424" y="597" width="276" height="135" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="562.0" y="638" font-size="28" font-weight="700" fill="#eaf1ff" text-anchor="middle">Firelock</text>
    <text x="562.0" y="674" font-size="24" fill="#b8cbf2" text-anchor="middle">Sandbox for</text>
    <text x="562.0" y="710" font-size="24" fill="#b8cbf2" text-anchor="middle">agents &amp; functions</text>
    <path d="M682 530 H712 V664 H768" fill="none" stroke="#ffffff" stroke-width="2.5" marker-end="url(#aa)"/>
    <path d="M1132 208 H1160 M1132 308 H1160 M1132 408 H1160 M1132 508 H1160" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M1132 108 H1160 V664 H1132" fill="none" stroke="#ffffff" stroke-width="2.5" marker-end="url(#aa)"/>
    <rect x="770" y="597" width="360" height="135" rx="6" fill="#10264a" stroke="#ffffff" stroke-width="2"/>
    <text x="950.0" y="638" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Audit trail</text>
    <text x="950.0" y="674" font-size="24" fill="#b8cbf2" text-anchor="middle">changes and</text>
    <text x="950.0" y="710" font-size="24" fill="#b8cbf2" text-anchor="middle">access decisions</text>
    <g transform="translate(1136 20) scale(0.0703)" role="img" aria-label="Kilimanjaro">
      <polygon points="256,37.2 441.248,358.064 70.752,358.064" fill="#1A66FF"/>
      <polygon points="57.392,375.608 114.784,474.8 0,474.8" fill="#FFFFFF"/>
      <polygon points="189.8,375.608 247.192,474.8 132.408,474.8" fill="#FFFFFF"/>
      <polygon points="322.2,375.608 379.592,474.8 264.808,474.8" fill="#FFFFFF"/>
      <polygon points="454.608,375.608 512,474.8 397.216,474.8" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
